project_root: training_pilot

dataset:
  raw_dir: data/raw
  filtered_dir: data/filtered
  split_seed: 42
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  class_names:
    keep:
      - pothole
      - crack
    drop:
      - manhole
    final_name: damage

training:
  imgsz: 640
  optimizer: AdamW
  cos_lr: true
  amp: true
  single_cls: true
  deterministic: true
  box: 9.0
  cls: 0.3
  val_conf: 0.001
  second_pass:
    epochs: null
    lr_scale: 0.1
    freeze: 0

augmentations:
  require_explicit_probabilities: true
  transforms:
    - name: RandomBrightnessContrast
      p: null
      kwargs: {}
    - name: RandomShadow
      p: null
      kwargs: {}
    - name: MotionBlur
      p: null
      kwargs: {}
    - name: GaussNoise
      p: null
      kwargs: {}
    - name: HueSaturationValue
      p: null
      kwargs: {}
    - name: CLAHE
      p: null
      kwargs: {}
    - name: RandomRain
      p: null
      kwargs: {}
    - name: GridDistortion
      p: null
      kwargs: {}

weights:
  pretrained_dir: weights/pretrained
  finetuned_dir: weights/finetuned
  obc_repo_weight_default: best.pt

external:
  yolov12_repo: external/yolov12
  oracl4_repo: external/RoadDamageDetection
  obc_repo: external/OBC-YOLOv8

models:
  - id: yolo12s_rezzzq
    display_name: rezzzq YOLOv12s
    backend: yolov12
    pretrained: weights/pretrained/yolo12s_rdd2022.pt
    repo_dir: external/yolov12
    epochs: 50
    batch: 32
    lr0: 0.00005
    freeze: 10
    patience: 15
    weight_decay: 0.001
  - id: ozair_yolov8
    display_name: ozair YOLOv8
    backend: ultralytics
    pretrained: weights/pretrained/ozair_yolov8_rdd.pt
    epochs: 60
    batch: 16
    lr0: 0.0001
    freeze: 10
    patience: 20
    weight_decay: 0.001
  - id: oracl4_yolov8
    display_name: oracl4 YOLOv8
    backend: ultralytics
    pretrained: weights/pretrained/oracl4_yolov8_rdd.pt
    epochs: 60
    batch: 16
    lr0: 0.0001
    freeze: 10
    patience: 20
    weight_decay: 0.001
  - id: obc_yolov8
    display_name: OBC-YOLOv8
    backend: obc
    pretrained: weights/pretrained/obc_yolov8_rdd.pt
    repo_dir: external/OBC-YOLOv8/ultralytics10.24
    epochs: 60
    batch: 16
    lr0: 0.0001
    freeze: 10
    patience: 20
    weight_decay: 0.0005

inference:
  tile_size: 640
  tile_overlap: 100
  scales:
    - 530
    - 640
    - 800
  flips:
    - none
    - horizontal
  model_weight_conf: 0.10
  precision_floor: 0.30
  primary_iou: 0.5
  all_damage_found_iou: 0.4
  per_tile_wbf:
    iou_grid:
      - 0.35
      - 0.40
      - 0.45
      - 0.50
    skip_box_grid:
      - 0.01
      - 0.02
      - 0.03
      - 0.05
    conf_type: weighted
  merge_wbf:
    iou_thr: 0.40
    skip_box_thr: 0.01
    conf_type: weighted
  conf_sweep:
    start: null
    stop: null
    step: null
