trainer: ultralytics
model: weights/pretrained/yolov8m.pt
data: configs/dataset.yaml
epochs: 80
imgsz: 640
batch: 32
lr0: 0.0008
lrf: 0.01
warmup_epochs: 5
momentum: 0.937
weight_decay: 0.001
freeze: 10
mosaic: 1.0
mixup: 0.2
copy_paste: 0.3
hsv_v: 0.4
fliplr: 0.5
degrees: 15.0
scale: 0.5
erasing: 0.4
optimizer: AdamW
cos_lr: true
amp: true
single_cls: true
close_mosaic: 10
patience: 20
dropout: 0.0
cls: 1.0
deterministic: true
seed: 42
project: runs
name: yolov8m_custom
notes: Medium COCO-pretrained detector from the guide.
