# V2 Un-choked Training Config: High-Recall Road Damage Detection
# Target: Submission Tomorrow
# Strategy: High-resolution (1024), Zero Noise Augmentation, Boosted Box Weights

trainer: ultralytics
model: weights/pretrained/yolov8m.pt
data: configs/dataset.yaml
epochs: 500
imgsz: 1024
batch: -1  # Autoscale for RTX 4090 VRAM (User Override)
lr0: 0.0008
lrf: 0.01
warmup_epochs: 5
momentum: 0.937
weight_decay: 0.001
freeze: 10
single_cls: true
deterministic: true
seed: 42

# --- Augmentation: Un-choking the Model ---
# High noise was causing underfitting on the 1k image dataset.
mosaic: 0.5        # Reduced from 1.0
mixup: 0.0         # Disabled (was 0.2)
erasing: 0.0       # Disabled (was 0.4)
copy_paste: 0.0    # Disabled (was 0.3)
close_mosaic: 20   # Fine-tune on clean images for the final 20 epochs

# --- Loss Weighting: High-Recall Priority ---
box: 10.0          # Increased from 7.5 to force better localization
cls: 1.0
dfl: 1.5

# --- Lifecycle Management ---
patience: 50       # Early stopping after 50 epochs of no mAP improvement
save: true
save_period: 10
plots: true
project: runs
name: yolov8m_v2_unchoked
