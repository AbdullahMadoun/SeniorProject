trainer: ultralytics
model: weights/pretrained/yolov8s.pt
data: configs/dataset.yaml
epochs: 80
imgsz: 640
batch: 32
lr0: 0.001
lrf: 0.01
warmup_epochs: 5
momentum: 0.937
weight_decay: 0.0005
freeze: 5
mosaic: 1.0
mixup: 0.3
copy_paste: 0.4
hsv_h: 0.05
