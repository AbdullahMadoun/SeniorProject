services:
  skylink-backend:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        BASE_IMAGE: ${SKYLINK_BASE_IMAGE:-python:3.11-slim}
    image: ${SKYLINK_BACKEND_IMAGE:-skylink-backend:local}
    container_name: skylink-backend
    restart: unless-stopped
    environment:
      SKYLINK_BRIDGE_PORT: ${SKYLINK_BRIDGE_PORT:-8001}
      SKYLINK_VLM_API_URL: ${SKYLINK_VLM_API_URL:-}
      SKYLINK_VLM_API_KEY: ${SKYLINK_VLM_API_KEY:-}
      SKYLINK_PUBLIC_BASE_URL: ${SKYLINK_PUBLIC_BASE_URL:-}
      SKYLINK_ENABLE_QUICK_TUNNEL: ${SKYLINK_ENABLE_QUICK_TUNNEL:-true}
      SKYLINK_EXPOSE_VLM_API_KEY_TO_FRONTEND: ${SKYLINK_EXPOSE_VLM_API_KEY_TO_FRONTEND:-false}
      SKYLINK_USE_BRIDGE_PROXY: ${SKYLINK_USE_BRIDGE_PROXY:-true}
      SKYLINK_FRONTEND_DIRECT_MODEL: ${SKYLINK_FRONTEND_DIRECT_MODEL:-true}
      SKYLINK_REMOTE_MODEL_AUTOSTART: ${SKYLINK_REMOTE_MODEL_AUTOSTART:-false}
      SKYLINK_REMOTE_MODEL_PROVIDER: ${SKYLINK_REMOTE_MODEL_PROVIDER:-ssh}
      SKYLINK_REMOTE_MODEL_SSH_HOST: ${SKYLINK_REMOTE_MODEL_SSH_HOST:-}
      SKYLINK_REMOTE_MODEL_SSH_PORT: ${SKYLINK_REMOTE_MODEL_SSH_PORT:-22}
      SKYLINK_REMOTE_MODEL_SSH_USER: ${SKYLINK_REMOTE_MODEL_SSH_USER:-root}
      SKYLINK_REMOTE_MODEL_SSH_KEY_FILE: ${SKYLINK_REMOTE_MODEL_SSH_KEY_FILE:-/root/.ssh/id_ed25519}
      SKYLINK_REMOTE_MODEL_SSH_PUBLIC_KEY_FILE: ${SKYLINK_REMOTE_MODEL_SSH_PUBLIC_KEY_FILE:-/root/.ssh/id_ed25519.pub}
      SKYLINK_REMOTE_MODEL_SSH_KNOWN_HOSTS_FILE: ${SKYLINK_REMOTE_MODEL_SSH_KNOWN_HOSTS_FILE:-/root/.ssh/known_hosts}
      SKYLINK_REMOTE_MODEL_SSH_STRICT_HOST_KEY_CHECKING: ${SKYLINK_REMOTE_MODEL_SSH_STRICT_HOST_KEY_CHECKING:-accept-new}
      SKYLINK_REMOTE_MODEL_REMOTE_PATH: ${SKYLINK_REMOTE_MODEL_REMOTE_PATH:-/opt/skylink-model-server}
      SKYLINK_REMOTE_MODEL_API_KEY: ${SKYLINK_REMOTE_MODEL_API_KEY:-}
      SKYLINK_REMOTE_MODEL_PORT: ${SKYLINK_REMOTE_MODEL_PORT:-17612}
      SKYLINK_REMOTE_MODEL_ENABLE_VLM: ${SKYLINK_REMOTE_MODEL_ENABLE_VLM:-true}
      SKYLINK_REMOTE_MODEL_ENABLE_YOLO_V8: ${SKYLINK_REMOTE_MODEL_ENABLE_YOLO_V8:-}
      SKYLINK_REMOTE_MODEL_VLM_MODEL: ${SKYLINK_REMOTE_MODEL_VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      SKYLINK_REMOTE_MODEL_GPU_MEM_UTIL: ${SKYLINK_REMOTE_MODEL_GPU_MEM_UTIL:-0.80}
      SKYLINK_REMOTE_MODEL_MAX_MODEL_LEN: ${SKYLINK_REMOTE_MODEL_MAX_MODEL_LEN:-16384}
      SKYLINK_REMOTE_MODEL_MAX_OUTPUT_TOKENS: ${SKYLINK_REMOTE_MODEL_MAX_OUTPUT_TOKENS:-16384}
      SKYLINK_REMOTE_MODEL_YOLO_V8: ${SKYLINK_REMOTE_MODEL_YOLO_V8:-}
      SKYLINK_REMOTE_MODEL_YOLO_V12: ${SKYLINK_REMOTE_MODEL_YOLO_V12:-rezzzq/yolo12s-road-damage-rdd2022}
      SKYLINK_REMOTE_MODEL_YOLO_V8_WEIGHTS_URL: ${SKYLINK_REMOTE_MODEL_YOLO_V8_WEIGHTS_URL:-https://huggingface.co/oracl4/YOLOv8_Small_RDD/resolve/main/YOLOv8_Small_RDD.pt}
      SKYLINK_REMOTE_MODEL_HF_TOKEN: ${SKYLINK_REMOTE_MODEL_HF_TOKEN:-}
      SKYLINK_REMOTE_MODEL_HF_HOME: ${SKYLINK_REMOTE_MODEL_HF_HOME:-}
      SKYLINK_REMOTE_MODEL_PREFETCH: ${SKYLINK_REMOTE_MODEL_PREFETCH:-true}
      SKYLINK_REMOTE_MODEL_ENABLE_QUICK_TUNNEL: ${SKYLINK_REMOTE_MODEL_ENABLE_QUICK_TUNNEL:-true}
      SKYLINK_REMOTE_MODEL_WAIT_FOR_HEALTH: ${SKYLINK_REMOTE_MODEL_WAIT_FOR_HEALTH:-true}
      SKYLINK_REMOTE_MODEL_WAIT_FOR_TUNNEL: ${SKYLINK_REMOTE_MODEL_WAIT_FOR_TUNNEL:-true}
      SKYLINK_VAST_API_KEY: ${SKYLINK_VAST_API_KEY:-}
      SKYLINK_VAST_INSTANCE_ID: ${SKYLINK_VAST_INSTANCE_ID:-}
      SKYLINK_VAST_INSTANCE_LABEL: ${SKYLINK_VAST_INSTANCE_LABEL:-skylink-managed-model}
      SKYLINK_VAST_PREFERRED_GPU_NAMES: ${SKYLINK_VAST_PREFERRED_GPU_NAMES:-RTX 4090,L40S,A100,H100}
      SKYLINK_VAST_MIN_GPU_RAM_GB: ${SKYLINK_VAST_MIN_GPU_RAM_GB:-24}
      SKYLINK_VAST_MAX_HOURLY_USD: ${SKYLINK_VAST_MAX_HOURLY_USD:-1.5}
      SKYLINK_VAST_MIN_RELIABILITY: ${SKYLINK_VAST_MIN_RELIABILITY:-0.97}
      SKYLINK_VAST_REQUIRE_VERIFIED: ${SKYLINK_VAST_REQUIRE_VERIFIED:-true}
      SKYLINK_VAST_SEARCH_LIMIT: ${SKYLINK_VAST_SEARCH_LIMIT:-25}
      SKYLINK_VAST_IMAGE: ${SKYLINK_VAST_IMAGE:-vastai/base-image:@vastai-automatic-tag}
      SKYLINK_VAST_DISK_GB: ${SKYLINK_VAST_DISK_GB:-64}
      SKYLINK_VAST_RUNTYPE: ${SKYLINK_VAST_RUNTYPE:-ssh_direct}
      SKYLINK_VAST_OFFER_TYPE: ${SKYLINK_VAST_OFFER_TYPE:-ondemand}
      SKYLINK_HISTORY_FILE: /var/lib/skylink/history.json
      SKYLINK_HISTORY_IMAGES_DIR: /var/lib/skylink/history_images
      SKYLINK_PROCESSED_HISTORY_DIR: /var/lib/skylink/processed_history
    ports:
      - "${SKYLINK_BRIDGE_PORT:-8001}:${SKYLINK_BRIDGE_PORT:-8001}"
    volumes:
      - skylink_backend_data:/var/lib/skylink
      - ./deploy/backend/ssh:/root/.ssh:ro

volumes:
  skylink_backend_data:
