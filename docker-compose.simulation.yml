services:
  skylink-simulation:
    build:
      context: .
      dockerfile: deploy/simulation/Dockerfile
    image: ${SKYLINK_SIMULATION_IMAGE:-skylink-simulation:local}
    container_name: skylink-simulation
    restart: unless-stopped
    environment:
      SKYLINK_API_CPU_CORE: ${SKYLINK_API_CPU_CORE:-0}
      SKYLINK_BOOTSTRAP_ON_START: ${SKYLINK_BOOTSTRAP_ON_START:-false}
      SKYLINK_EXECUTION_CPU_CORES: ${SKYLINK_EXECUTION_CPU_CORES:-2,3}
      SKYLINK_MISSION_API_PORT: 8625
    ports:
      - "${SKYLINK_MISSION_API_PORT:-8625}:8625"
      - "${SKYLINK_COMPANION_MJPEG_PORT:-8765}:8765"
    volumes:
      - ./artifacts:/opt/skylink2/artifacts
